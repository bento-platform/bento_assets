name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check --diff
          src: ./scripts

      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
          src: ./scripts
